name: Aggregate org metrics

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write   # commit refreshed metrics back

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect aggregate metrics
        env:
          GH_TOKEN: ${{ secrets.ORG_METRICS_PAT }}
        run: node scripts/collect-metrics.mjs monolythium

      - name: Inject metrics block into profile README
        run: bash scripts/inject-readme-metrics.sh

      - name: Commit refreshed metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/ profile/README.md
          if git diff --cached --quiet; then
            echo "No metrics changes to commit"
            exit 0
          fi
          git commit -m "Refresh org metrics ($(date -u +%Y-%m-%d))"
          git push
